
<div class="app-dashboard" dir="rtl">
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <div class="logo-area">
        <div class="user-avatar">RA</div>
        <h2 class="brand-title">ربحني</h2>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        <i class="bi bi-grid-1x2-fill"></i> <span>الرئيسية</span>
      </a>
      <a routerLink="/products" routerLinkActive="active" class="nav-link">
        <i class="bi bi-bag-heart-fill"></i> <span>المنتجات</span>
      </a>
      <a routerLink="/auctions" routerLinkActive="active" class="nav-link">
        <i class="bi bi-cash-coin"></i> <span>المزادات</span>
      </a>
      <a routerLink="/ads" routerLinkActive="active" class="nav-link">
        <i class="bi bi-bullseye"></i> <span>الاعلانات</span>
      </a>
      <a routerLink="/comp" routerLinkActive="active" class="nav-link">
        <i class="bi bi-building-fill"></i> <span>الشركات</span>
      </a>
      <a routerLink="/count" routerLinkActive="active" class="nav-link">
        <i class="bi bi-globe"></i> <span>البلاد</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-link" type="button" (click)="logout()">
        <span>تسجيل الخروج</span> <i class="bi bi-box-arrow-left"></i>
      </button>
    </div>
  </aside>

  <main class="app-main-content">
      <header class="main-header">
        <div class="header-right">
          <span class="app-kicker">ربحني</span>
          <h1 class="m-0 fs-5 fs-md-3">{{ screenTitle }}</h1>
        </div>

        <div class="header-left d-flex align-items-center gap-1 gap-md-4">
          <div class="user-info">
            <div class="user-text text-end">
              <small class="d-none d-sm-inline">مرحباً بك،</small>
              <strong class="d-block">المدير المسؤول</strong>
            </div>
          </div>

            <div class="header-country-select">
              <app-modern-select
                [options]="countrySelectOptions"
                [ngModel]="selectedCountry()"
                (ngModelChange)="selectCountry($event)"
                placeholder="اختر الدولة"
                searchPlaceholder="ابحث عن دولة..."
                [searchable]="true">
              </app-modern-select>
            </div>
        </div>
      </header>
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<div class="app-more" *ngIf="moreOpen">
  <div class="app-more-backdrop" (click)="closeMore()"></div>
  <div class="app-more-sheet" (click)="$event.stopPropagation()">
    <span class="app-more-handle"></span>
    <a routerLink="/comp" routerLinkActive="active" (click)="closeMore()">
      <i class="bi bi-building-fill"></i>
      <span>الشركات</span>
    </a>
    <a routerLink="/count" routerLinkActive="active" (click)="closeMore()">
      <i class="bi bi-globe"></i>
      <span>البلاد</span>
    </a>
    <a class="is-logout" (click)="logout()">
      <i class="bi bi-box-arrow-left"></i>
      <span>تسجيل الخروج</span>
    </a>
  </div>
</div>

<nav class="app-tabbar" aria-label="تنقل التطبيق">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
    <i class="bi bi-grid-1x2-fill"></i>
    <span>الرئيسية</span>
  </a>
  <a routerLink="/products" routerLinkActive="active">
    <i class="bi bi-bag-heart-fill"></i>
    <span>المنتجات</span>
  </a>
  <a routerLink="/auctions" routerLinkActive="active">
    <i class="bi bi-cash-coin"></i>
    <span>المزادات</span>
  </a>
  <a routerLink="/ads" routerLinkActive="active">
    <i class="bi bi-bullseye"></i>
    <span>الإعلانات</span>
  </a>
  <button type="button" [class.active]="moreOpen || moreSectionActive" (click)="toggleMore($event)">
    <i class="bi bi-grid-fill"></i>
    <span>المزيد</span>
  </button>
</nav>

<div class="radial-nav" [class.is-open]="isRadialOpen()">
  <div class="radial-backdrop" (click)="closeRadial()"></div>
  <div class="radial-stage" #radialStage>
    <div class="radial-disc"></div>
    <a *ngFor="let item of mobileNav; let i = index"
       class="radial-item"
       [class.logout]="item.logout"
       [routerLink]="item.path"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: !!item.exact }"
       [style.--i]="i"
       (click)="item.logout ? logout() : closeRadial()">
      <i class="bi" [ngClass]="item.icon"></i>
      <span>{{ item.label }}</span>
    </a>
    <button type="button" class="radial-fab" (click)="toggleRadial()" [attr.aria-expanded]="isRadialOpen()" aria-label="القائمة">
      <i class="bi" [ngClass]="isRadialOpen() ? 'bi-x-lg' : 'bi-grid-3x3-gap-fill'"></i>
    </button>
  </div>
</div>
